- project:
    templates:
      - charm-unit-jobs-py310
    check:
      jobs:
      - jammy-yoga
      - jammy-zed
    vars:
      needs_charm_build: true
      charm_build_name: designate
      build_type: charmcraft
      charmcraft_channel: 3.x/stable

- job:
    name: jammy-yoga
    parent: func-target
    dependencies:
      - osci-lint
      - name: tox-py310
        soft: true
      - charm-build
    vars:
      tox_extra_args: jammy-yoga
- job:
    name: jammy-zed
    parent: func-target
    dependencies:
      - jammy-yoga
    vars:
      tox_extra_args: jammy-zed
