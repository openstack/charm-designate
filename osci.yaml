- project:
    templates:
      - charm-unit-jobs-py310
    check:
      jobs:
      - jammy-bobcat
      - jammy-caracal
      - noble-caracal
    vars:
      needs_charm_build: true
      charm_build_name: designate
      build_type: charmcraft
      charmcraft_channel: 3.x/stable

- job:
    name: jammy-bobcat
    parent: func-target
    vars:
      tox_extra_args: jammy-bobcat
- job:
    name: jammy-caracal
    parent: func-target
    dependencies:
      - jammy-bobcat
    vars:
      tox_extra_args: jammy-caracal
- job:
    name: noble-caracal
    parent: func-target
    dependencies:
      - jammy-bobcat
    vars:
      tox_extra_args: noble-caracal
